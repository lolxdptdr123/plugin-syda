# Sydaria - configuration principale (Spigot 1.8.9)

prefix: "&8[&6Sydaria&8] &7"

anti-cleanup:
  enabled: true
  duration-seconds: 30
  protect-killer-drops: true

anti-command:
  enabled: true
  blocked:
    - "plugins"
    - "pl"
    - "ver"
    - "version"
    - "about"
    - "bukkit:plugins"
    - "bukkit:pl"
    - "bukkit:ver"
    - "bukkit:about"
    - "icanhasbukkit"
    - "?"
    - "me"
    - "tell"
    - "bukkit:tell"
  message: "&cCette commande est désactivée."

atouts:
  # /atouts sert uniquement à activer/désactiver les atouts déjà débloqués.
  # Les achats d'atouts se font dans /boutique.
  effects:
    SPEED: { amplifier: 1, display: "&bSpeed" }
    INCREASE_DAMAGE: { amplifier: 0, display: "&cForce" }
    FIRE_RESISTANCE: { amplifier: 0, display: "&6FireResistance" }
    FAST_DIGGING: { amplifier: 1, display: "&eHaste" }
  flags:
    ANTI_CHUTE: "&aAntiChute"
    NO_HUNGER: "&eNoHunger"
    NO_DEBUFF: "&dNoDebuff"
    KEEP_XP: "&bKeepXP"

# Système de rankup : progression de grades achetable.
# /rankup = menu + achat avec l'argent (ou tokens selon config).
# Les grades sont aussi disponibles dans /shop (catégorie "grades").
# Nécessite LuckPerms pour appliquer les groupes.
rankup:
  enabled: true
  gui:
    enabled: true
    title: "&8&lRankup &7» &aGrades"
    slots:
      - 10
      - 12
      - 14
      - 16
      - 21
      - 23
      - 25
    rank-material:
      chevalier: GOLD_HELMET
      marquis: DIAMOND_HELMET
      seigneur: GOLD_CHESTPLATE
      empereur: DIAMOND_CHESTPLATE
      supreme: NETHER_STAR
      star: BEACON
  ladder:
    - default
    - chevalier
    - marquis
    - seigneur
    - empereur
    - supreme
    - star
  ranks:
    chevalier:
      cost: 50000
      currency: money
    marquis:
      cost: 150000
      currency: money
    seigneur:
      cost: 500000
      currency: money
    empereur:
      cost: 1500000
      currency: money
    supreme:
      cost: 5000000
      currency: money
    star:
      cost: 15000000
      currency: money

# Commandes débloquées par grade (LuckPerms).
# min-grade = grade minimum requis (default, chevalier, marquis, seigneur, empereur, supreme, star)
grade-commands:
  enabled: true
  no-permission: "&cTu dois être au grade &e%grade% &cminimum pour utiliser &e/%cmd%&c."
  cooldown-message: "&cCommande en cooldown. &7Attends &e%time%s&7."
  messages:
    feed: "&aTu as été nourri."
    refill: "&a%count% slot(s) rempli(s) avec des potions."
  commands:
    feed:
      enabled: true
      min-grade: marquis
      cooldown-seconds: 300
    pv:
      enabled: true
      min-grade: supreme
      max-vaults: 5
      size: 54
      title: "&8Coffre privé #%number%"
    ec:
      enabled: true
      min-grade: marquis
      cooldown-seconds: 0
    refill:
      enabled: true
      min-grade: marquis
      cooldown-seconds: 10
      potions:
        - type: INSTANT_HEAL
          level: 3
          splash: true
    craft:
      enabled: true
      min-grade: chevalier
      cooldown-seconds: 0
    near:
      enabled: true
      min-grade: seigneur
      radius: 100
      cooldown-seconds: 30

# GUIs d'achat
# /boutique = tokens ; /shop = argent via Vault.
# Le fonctionnement est : menu principal -> catégorie -> article.
#
# Pour ajouter une catégorie :
#   1. Ajoute-la sous categories.
#   2. Ajoute les IDs des articles dans items.
# Pour ajouter un article : ajoute son ID sous items.

boutique:
  enabled: true
  title: "&8&lBoutique &7» &6Tokens"
  size: 54

  # Slots des catégories dans le menu principal
  category-slots:
    - 10
    - 12
    - 14
    - 16
    - 28
    - 30
    - 32
    - 34

  # Slots des articles dans une catégorie
  item-slots:
    - 10
    - 11
    - 12
    - 13
    - 14
    - 15
    - 16
    - 19
    - 20
    - 21
    - 22
    - 23
    - 24
    - 25
    - 28
    - 29
    - 30
    - 31
    - 32
    - 33
    - 34
    - 37
    - 38
    - 39
    - 40
    - 41
    - 42
    - 43

  buttons:
    back:
      enabled: true
      slot: 45
      material: ARROW
      name: "&c&lRetour"
      lore:
        - "&7Retour aux catégories."

    previous:
      enabled: true
      slot: 47
      material: ARROW
      name: "&e&lPage précédente"
      lore:
        - "&7Retourner à la page précédente."

    balance:
      enabled: true
      slot: 48
      material: GOLD_INGOT
      name: "&6&lTes Tokens"
      lore:
        - "&7Solde : &6%tokens% tokens"

    close:
      enabled: true
      slot: 49
      material: BARRIER
      name: "&c&lFermer"
      lore:
        - "&7Fermer le menu."

    next:
      enabled: true
      slot: 53
      material: ARROW
      name: "&a&lPage suivante"
      lore:
        - "&7Aller à la page suivante."

  information:
    slot: 4
    material: BOOK
    name: "&6&lBoutique Sydaria"
    lore:
      - "&7Achète tes atouts avec tes tokens."
      - "&7Une fois acheté, utilise &e/atouts&7."

  categories:
    atouts_combat:
      name: "&c&lAtouts Combat"
      material: DIAMOND_SWORD
      lore:
        - "&7Atouts pour améliorer tes combats."
        - "&7Paiement en tokens."
      items:
        - INCREASE_DAMAGE
        - FIRE_RESISTANCE

    atouts_utilitaires:
      name: "&b&lAtouts Utilitaires"
      material: FEATHER
      lore:
        - "&7Atouts pour améliorer ton confort."
        - "&7Paiement en tokens."
      items:
        - SPEED
        - FAST_DIGGING
        - ANTI_CHUTE
        - NO_HUNGER
        - NO_DEBUFF
        - KEEP_XP

    grades:
      name: "&2&lGrades"
      material: GOLD_HELMET
      lore:
        - "&7Achète ton prochain grade."
        - "&7Paiement en tokens."
        - "&7Tu peux aussi utiliser &e/rankup &7(argent)."
      items:
        - RANKUP_CHEVALIER
        - RANKUP_MARQUIS
        - RANKUP_SEIGNEUR
        - RANKUP_EMPEREUR
        - RANKUP_SUPREME
        - RANKUP_STAR

    kits:
      name: "&6&lKits"
      material: CHEST
      lore:
        - "&7Achète des kits permanents."
        - "&7Récupère-les avec &e/kit&7."
        - "&7Paiement en tokens."
      items:
        - KIT_PVP
        - KIT_MINER
        - KIT_REFILL

  # Les définitions peuvent rester ici.
  # Le code accepte aussi les définitions directement sous categories.<id>.items.<id>.
  items:
    SPEED:
      type: ATOUT
      atout: SPEED
      name: "&b&lAtout Speed"
      material: SUGAR
      lore:
        - "&7Obtiens un bonus de vitesse."
        - "&7Utilise /atouts pour l'activer."
      price: 500

    INCREASE_DAMAGE:
      type: ATOUT
      atout: INCREASE_DAMAGE
      name: "&c&lAtout Force"
      material: BLAZE_POWDER
      lore:
        - "&7Augmente ta puissance en combat."
        - "&7Utilise /atouts pour l'activer."
      price: 750

    FIRE_RESISTANCE:
      type: ATOUT
      atout: FIRE_RESISTANCE
      name: "&6&lAtout Fire Resistance"
      material: MAGMA_CREAM
      lore:
        - "&7Protège contre le feu et la lave."
        - "&7Utilise /atouts pour l'activer."
      price: 600

    FAST_DIGGING:
      type: ATOUT
      atout: FAST_DIGGING
      name: "&e&lAtout Haste"
      material: GOLD_PICKAXE
      lore:
        - "&7Mine plus rapidement."
        - "&7Utilise /atouts pour l'activer."
      price: 650

    ANTI_CHUTE:
      type: ATOUT
      atout: ANTI_CHUTE
      name: "&a&lAtout Anti-Chute"
      material: FEATHER
      lore:
        - "&7Annule les dégâts de chute."
        - "&7Utilise /atouts pour l'activer."
      price: 400

    NO_HUNGER:
      type: ATOUT
      atout: NO_HUNGER
      name: "&e&lAtout No-Hunger"
      material: COOKED_BEEF
      lore:
        - "&7Empêche la faim de diminuer."
        - "&7Utilise /atouts pour l'activer."
      price: 500

    NO_DEBUFF:
      type: ATOUT
      atout: NO_DEBUFF
      name: "&d&lAtout No-Debuff"
      material: MILK_BUCKET
      lore:
        - "&7Supprime les effets négatifs."
        - "&7Utilise /atouts pour l'activer."
      price: 900

    KEEP_XP:
      type: ATOUT
      atout: KEEP_XP
      name: "&b&lAtout Keep-XP"
      material: EXP_BOTTLE
      lore:
        - "&7Conserve ton expérience à ta mort."
        - "&7Utilise /atouts pour l'activer."
      price: 1000

    RANKUP_CHEVALIER:
      type: RANKUP
      rank: chevalier
      name: "&2&lGrade Chevalier"
      material: LEATHER_HELMET
      lore:
        - "&7Passe au grade Chevalier."
      price: 5000

    RANKUP_MARQUIS:
      type: RANKUP
      rank: marquis
      name: "&3&lGrade Marquis"
      material: CHAIN_HELMET
      lore:
        - "&7Passe au grade Marquis."
      price: 15000

    RANKUP_SEIGNEUR:
      type: RANKUP
      rank: seigneur
      name: "&e&lGrade Seigneur"
      material: IRON_CHESTPLATE
      lore:
        - "&7Passe au grade Seigneur."
      price: 50000

    RANKUP_EMPEREUR:
      type: RANKUP
      rank: empereur
      name: "&6&lGrade Empereur"
      material: GOLD_CHESTPLATE
      lore:
        - "&7Passe au grade Empereur."
      price: 150000

    RANKUP_SUPREME:
      type: RANKUP
      rank: supreme
      name: "&5&lGrade Supreme"
      material: DIAMOND_CHESTPLATE
      lore:
        - "&7Passe au grade Supreme."
      price: 500000

    RANKUP_STAR:
      type: RANKUP
      rank: star
