# Lien Minecraft <-> Discord (bot separe : dossier discord-bot/).
# 1. Cree une application https://discord.com/developers/applications
# 2. Bot -> Reset Token, intents : MESSAGE CONTENT + SERVER MEMBERS
# 3. Invite le bot (Gerer les surnoms + Gerer les roles)
# 4. Salon de lien : ID dans discord-bot/.env (LINK_CHANNEL_ID + GUILD_ID + DISCORD_TOKEN)
# 5. Ici : api-port + api-secret (identique a PLUGIN_SECRET du bot)
# 6. Dans discord-bot/ : npm install && node index.js
