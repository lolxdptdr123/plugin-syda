core:
  death-inventory-preview: true
  death-inventory:
    expire-minutes: 10
    show-weapon: true
    replace-vanilla-message: true
    message: "&e%victim% &7a été tué par &c%killer%%weapon%&7."
    link-text: "&7[&fInventoryView&7]"
    hover: "&eClique pour voir le stuff de &c%killer%&e."
  nametag-health: true
  nametag-health-suffix: "&c❤"
  double-xp-multiplier: 2.0
  repair:
    cooldown-seconds: 120
    max-per-item: 3
  bottle-xp:
    xp-per-bottle: 20
  welcome:
    reward: 50.0
    cooldown-seconds: 60
    use-vault: true
  explosion-durability:
    enabled: true
    default-hits: 1
    blocks:
      OBSIDIAN: 8
      ENDER_STONE: 4
      WATER: 999
  noheal-blocks:
    - STAINED_GLASS
    - STAINED_CLAY
  randomkey-keys:
    - VOTE
    - COMMON
    - RARE
    - LEGENDARY

scoreboard:
  enabled: true
  title: "&c✺ &6Sydaria.fr &c✺"
  refresh-ticks: 20
  # Nom du grade par défaut affiché (%grade%) quand le joueur n'a pas de groupe
  # de permission particulier / n'est associé à aucune entrée ci-dessous.
  grade-default: "Joueur"
  # Nom du grade affiché dans le scoreboard (%grade%), par groupe de permission
  # (LuckPerms/PermissionsEx). La clé est le nom du groupe en minuscule.
  grades:
    star: "Star"
    supreme: "&5Supreme"
    empereur: "&6Empereur"
    seigneur: "&eSeigneur"
    marquis: "&3Marquis"
    chevalier: "&2Chevalier"
    vip: "VIP"
    mvp: "MVP"
    default: "Joueur"
  # Couleur du grade appliquée au nom du grade ET au pseudo dans le chat public,
  # le tab-list et au-dessus de la tête, par groupe de permission (ex: &d = violet
  # clair -> "Star Pseudo" tout en violet). Un groupe absent d'ici (ou "" comme
  # couleur) n'affiche rien devant le pseudo, même s'il a un nom dans "grades" ci-
  # dessus. Rappel : le grade donne des permissions/commandes en plus (LuckPerms),
  # contrairement au tag (/tags) qui est purement décoratif.
  grade-colors:
    default: "&7"
    star: "&d"
    supreme: "&5"
    empereur: "&6"
    seigneur: "&e"
    marquis: "&3"
    chevalier: "&2"
    vip: "&a"
    mvp: "&b"
  lines:
    - "&f&m--------------------"
    - "&6%player%"
    - "&fGrade: &d%grade%"
    - "&fFaction: &c%faction%"
    - "&fArgent: &e%money% &6❂"
    - "&fCendres: &d%cendres% &d❂"
    - "&fTokens: &b%tokens% &b❂"
    - " "
    - "&6Infos"
    - "&fPower: &e%power%"
    - "&fFly Claim: &a%flyclaim%"
    - "  "
    - "&fVotes: &b%votes%"
    - "&f&m--------------------"

