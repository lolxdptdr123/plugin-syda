# Draftmc - configuration principale (Spigot 1.8.9)

prefix: "&8[&6Draftmc&8] &7"

anti-cleanup:
  enabled: true
  duration-seconds: 30
  protect-killer-drops: true
  hologram: true
  hologram-height: 1.8
  hologram-text: "&cAnti-clean &7» &e{time}s"

teleport:
  command-cooldown-seconds: 5
  cooldown-message: "&cAttends encore &e{time}s &cavant une téléportation."

# Combat tag : tag PvP, blocage des teleports, mort si deconnexion.
combat-tag:
  enabled: true
  duration-seconds: 15
  combat-log: true
  actionbar: true
  ignore-faction: true
  message: "&cTu es en combat encore &e{time}s&c."
  tagged-message: "&cTu es en combat pendant &e{time}s&c."
  untagged-message: "&aTu n'es plus en combat."
  log-broadcast: "&c{player} s'est déconnecté en combat."
  blocked-commands:
    - home
    - sethome
    - homes
    - tpa
    - tpahere
    - tpyes
    - tpaccept
    - tpdeny
    - back
    - randomtp
    - rtp
    - spawn
    - warp
    - warps
    - setwarp
    - delwarp
    - tp
    - fly
    - refill
    - shop
    - boutique
    - magasin
    - kit
    - kits
    - bin
    - poubelle
    - trash
    - ec
    - pv
    - invsee
    - hat
    - hdv
    - ah
    - auction
    - rankup
    - grade
    - grades
    - gradecmds
    - sell
    - sellall
    - repair
    - repairall
  blocked-subcommands:
    - "f home"
    - "f sethome"
    - "f fly"
    - "repair all"
    - "sell all"

tpa:
  expire-seconds: 60

enderpearl:
  enabled: true
  cooldown-seconds: 15
  message: "&cEnderpearl en cooldown : &e{time}s"

homes:
  teleport-delay-seconds: 5
  cancel-on-move: true
  cancel-on-damage: true
  warmup-message: "&7Téléportation dans &e{time}s&7. &8Ne bouge pas."
  cancel-move-message: "&cTéléportation annulée : tu as bougé."
  cancel-damage-message: "&cTéléportation annulée : tu as pris des dégâts."

warps:
  teleport-delay-seconds: 5
  cancel-on-move: true
  cancel-on-damage: true
  warmup-message: "&7Téléportation dans &e{time}s&7. &8Ne bouge pas."
  cancel-move-message: "&cTéléportation annulée : tu as bougé."
  cancel-damage-message: "&cTéléportation annulée : tu as pris des dégâts."

anti-command:
  enabled: true
  blocked:
    - "plugins"
    - "pl"
    - "ver"
    - "version"
    - "about"
    - "bukkit:plugins"
    - "bukkit:pl"
    - "bukkit:ver"
    - "bukkit:about"
    - "icanhasbukkit"
    - "?"
    - "me"
    - "tell"
    - "bukkit:tell"
  message: "&cCette commande est désactivée."

atouts:
  # /atouts sert uniquement à activer/désactiver les atouts déjà débloqués.
  # Les achats d'atouts se font dans /boutique.
  effects:
    SPEED: { amplifier: 1, display: "&bSpeed" }
    INCREASE_DAMAGE: { amplifier: 0, display: "&cForce" }
    FIRE_RESISTANCE: { amplifier: 0, display: "&6FireResistance" }
    FAST_DIGGING: { amplifier: 1, display: "&eHaste" }
  flags:
    ANTI_CHUTE: "&aAntiChute"
    NO_HUNGER: "&eNoHunger"
    NO_DEBUFF: "&dNoDebuff"
    KEEP_XP: "&bKeepXP"

# Système de rankup : progression de grades achetable.
# /rankup = menu + achat avec l'argent (ou tokens selon config).
# Les grades sont aussi disponibles dans /shop (catégorie "grades").
# Nécessite LuckPerms pour appliquer les groupes.
rankup:
  enabled: true
  gui:
    enabled: true
    title: "&8&lRankup &7» &aGrades"
    slots:
      - 10
      - 12
      - 14
      - 16
      - 21
      - 23
      - 25
    rank-material:
      chevalier: GOLD_HELMET
      marquis: DIAMOND_HELMET
      seigneur: GOLD_CHESTPLATE
      empereur: DIAMOND_CHESTPLATE
      supreme: NETHER_STAR
      star: BEACON
  ladder:
    - default
    - chevalier
    - marquis
    - seigneur
    - empereur
    - supreme
    - star
  ranks:
    chevalier:
      cost: 50000
      currency: money
      advantages:
        - "&7Préfixe &2Chevalier Pseudo"
        - "&7Grade Discord Chevalier"
        - "&e/kit chevalier"
        - "&e/craft &7/bottlexp"
        - "&73 sethomes &8| &75 ventes HDV"
        - "&7Accès Shop Kits"
    marquis:
      cost: 150000
      currency: money
      advantages:
        - "&7Préfixe &3Marquis Pseudo"
        - "&7Grade Discord Marquis"
        - "&e/kit marquis"
        - "&e/feed &7/refill &7/compact"
        - "&74 sethomes &8| &76 ventes HDV"
        - "&7Accès Shop Spawners"
    seigneur:
      cost: 500000
      currency: money
      advantages:
        - "&7Préfixe &eSeigneur Pseudo"
        - "&7Grade Discord Seigneur"
        - "&e/kit seigneur"
        - "&75 sethomes &8| &78 ventes HDV"
        - "&7Conserve les avantages inférieurs"
    empereur:
      cost: 1500000
      currency: money
      advantages:
        - "&7Préfixe &6Empereur Pseudo"
        - "&7Grade Discord Empereur"
        - "&e/kit empereur"
        - "&e/hat &7/near &7/back &7/ec"
        - "&e/pv 1"
        - "&e/repair &72h &8| &e/repair all &76h"
        - "&78 sethomes &8| &712 ventes HDV"
        - "&7Accès Shop Atouts"
    supreme:
      cost: 5000000
      currency: money
      advantages:
        - "&7Préfixe &5Supreme Pseudo"
        - "&7Grade Discord Supreme"
        - "&e/kit supreme"
        - "&e/pv 1-2 &7/invsee &7/f fly"
        - "&e/sell all"
        - "&e/repair &72min &8| &e/repair all &71h"
        - "&712 sethomes &8| &715 ventes HDV"
        - "&7Accès Shop Items"
    star:
      cost: 15000000
      currency: money
      advantages:
        - "&7Préfixe &dStar Pseudo"
        - "&7Grade Discord Star"
        - "&7Tous les avantages Supreme"

# Commandes débloquées par grade (LuckPerms).
# min-grade = grade minimum requis (default, chevalier, marquis, seigneur, empereur, supreme, star)
grade-commands:
  enabled: true
  no-permission: "&cTu dois être au grade &e%grade% &cminimum pour utiliser &e/%cmd%&c."
  cooldown-message: "&cCommande en cooldown. &7Attends &e%time%s&7."
  messages:
    feed: "&aTu as été nourri."
    refill: "&a%count% slot(s) rempli(s) avec des potions."
  commands:
    craft:
      enabled: true
      min-grade: chevalier
      cooldown-seconds: 0
      description: Table de craft
    bottlexp:
      enabled: true
      min-grade: chevalier
      cooldown-seconds: 0
      description: Transforme l'XP en bouteilles
    feed:
      enabled: true
      min-grade: marquis
      cooldown-seconds: 300
      description: Se nourrir
    refill:
      enabled: true
      min-grade: marquis
      cooldown-seconds: 120
      description: Remplit tes potions
      potions:
        - type: INSTANT_HEAL
          level: 2
          splash: false
        - type: SPEED
          level: 2
          splash: false
        - type: FIRE_RESISTANCE
          level: 1
          splash: false
        - type: STRENGTH
          level: 2
          splash: false
    compact:
      enabled: true
      min-grade: marquis
      cooldown-seconds: 0
      description: Compacte minerais et lingots
    hat:
      enabled: true
      min-grade: empereur
      cooldown-seconds: 0
      description: Item sur la tete
    near:
      enabled: true
      min-grade: empereur
      radius: 100
      cooldown-seconds: 30
      description: Joueurs proches
    back:
      enabled: true
      min-grade: empereur
      cooldown-seconds: 0
      description: Retour a la derniere position
    ec:
      enabled: true
      min-grade: empereur
      cooldown-seconds: 0
      description: Enderchest
    pv:
      enabled: true
      min-grade: empereur
      max-vaults: 1
      size: 54
      title: "&8Coffre privé #%number%"
      description: Coffres privés
    repair:
      enabled: true
      min-grade: empereur
      description: Repare tes items
    invsee:
      enabled: true
      min-grade: supreme
      cooldown-seconds: 0
      description: Voir l'inventaire d'un joueur
    sellall:
      enabled: true
      min-grade: supreme
      cooldown-seconds: 30
      description: Vend tout l'inventaire

# GUIs d'achat
# /boutique = tokens ; /shop = argent via Vault.
# Le fonctionnement est : menu principal -> catégorie -> article.
#
# Pour ajouter une catégorie :
#   1. Ajoute-la sous categories.
#   2. Ajoute les IDs des articles dans items.
# Pour ajouter un article : ajoute son ID sous items.

boutique:
  enabled: true
  title: "&8&lBoutique &7» &6Tokens"
  size: 54

  # Slots des catégories dans le menu principal
  category-slots:
    - 10
    - 12
    - 14
    - 16
    - 28
    - 30
    - 32
    - 34

  # Slots des articles dans une catégorie
  item-slots:
    - 10
    - 11
    - 12
    - 13
    - 14
    - 15
    - 16
    - 19
    - 20
    - 21
    - 22
    - 23
    - 24
    - 25
    - 28
    - 29
    - 30
    - 31
    - 32
    - 33
    - 34
    - 37
    - 38
    - 39
    - 40
    - 41
    - 42
    - 43

  buttons:
    back:
      enabled: true
      slot: 45
      material: ARROW
      name: "&c&lRetour"
      lore:
        - "&7Retour aux catégories."

    previous:
      enabled: true
      slot: 47
      material: ARROW
      name: "&e&lPage précédente"
      lore:
        - "&7Retourner à la page précédente."

    balance:
      enabled: true
      slot: 48
      material: GOLD_INGOT
      name: "&6&lTes Tokens"
      lore:
        - "&7Solde : &6%tokens% tokens"

    close:
      enabled: true
      slot: 49
      material: BARRIER
      name: "&c&lFermer"
      lore:
        - "&7Fermer le menu."

    next:
      enabled: true
      slot: 53
      material: ARROW
      name: "&a&lPage suivante"
      lore:
        - "&7Aller à la page suivante."

  information:
    slot: 4
    material: BOOK
    name: "&6&lBoutique Draftmc"
    lore:
      - "&7Achète tes atouts avec tes tokens."
      - "&7Une fois acheté, utilise &e/atouts&7."

  categories:
    grades_abonnement:
      name: "&2&lGrade & Abonnement"
      material: GOLD_HELMET
      lore:
        - "&7Achète ton prochain grade."
        - "&7Paiement en tokens."
        - "&7Tu peux aussi utiliser &e/rankup &7(argent)."
