# Tournoi PvP Draftmc
# /tournament ...  |  /status
# Plusieurs arenes = plusieurs fights en parallele (1 fight / arene).

prefix: "&8[&6Tournoi&8] &7"
winner-tokens: 200
countdown-seconds: 5
cleanup-radius: 80
cancel-ally-damage: true
prevent-item-drop: true
freeze-countdown: true

restore:
  health: 20
  food: 20
  saturation: 20
  clear-inventory: true
  clear-effects: true
  gamemode: SURVIVAL
  teleport: warp
  warp: tournois

# Coordonnees de sortie (prioritaires sur le warp). /tournament setlobby
lobby: ""

effects:
  enabled: true
  radius: 80
  speed: 1
  strength: 0
  fire-resistance: true

defaults:
  team-size: 1
  teams: 8
  loser-bracket: false

kit:
  enabled: true
  items:
    - material: DIAMOND_HELMET
      slot: helmet
      enchantments:
        - PROTECTION_ENVIRONMENTAL:4
        - DURABILITY:3
    - material: DIAMOND_CHESTPLATE
      slot: chestplate
      enchantments:
        - PROTECTION_ENVIRONMENTAL:4
        - DURABILITY:3
    - material: DIAMOND_LEGGINGS
      slot: leggings
      enchantments:
        - PROTECTION_ENVIRONMENTAL:4
        - DURABILITY:3
    - material: DIAMOND_BOOTS
      slot: boots
      enchantments:
        - PROTECTION_ENVIRONMENTAL:4
        - DURABILITY:3
    - material: DIAMOND_SWORD
      slot: hand
      enchantments:
        - DAMAGE_ALL:5
        - DURABILITY:3
        - FIRE_ASPECT:2
    - material: BOW
      enchantments:
        - ARROW_DAMAGE:3
        - ARROW_INFINITE:1
    - material: ARROW
      amount: 1
    - material: GOLDEN_APPLE
      amount: 8
    - material: COOKED_BEEF
      amount: 16
    - material: POTION
      potion-type: INSTANT_HEAL
      potion-level: 2
      splash: true
      amount: 16

