# Event TeamFight - plugins/Draftmc/teamfight.yml
# Inscriptions : /event start teamfight default
# Roster : /teamfight create  (nom = faction)  puis  /teamfight invite <joueur>
# Lancement : 2e /event start teamfight default  (au moins 2 equipes de min-roster)

prefix: "&8[&6TeamFight&8] &7"

roster-size: 8
min-roster: 3
max-teams: 8
countdown-seconds: 5
between-match-seconds: 15
prevent-item-drop: true
cancel-ally-damage: true

# Points F Top pour le top 3 du tournoi (1er / 2e / 3e).
ranking-points:
  1: 15
  2: 10
  3: 5

# Seul /feed est autorise dans l'arene pendant le fight (admins : /teamfight stop).
arena-allowed-commands:
  - feed

# Effects infinis dans l'arene (amplifier 0 = niveau 1, 1 = niveau 2).
arena-effects:
  - { type: SPEED, amplifier: 1 }
  - { type: INCREASE_DAMAGE, amplifier: 0 }
  - { type: FIRE_RESISTANCE, amplifier: 0 }

spawns:
  a:
    world: world
    x: 0
    y: 64
    z: 0
    yaw: 0
    pitch: 0
  b:
    world: world
    x: 20
    y: 64
    z: 0
    yaw: 180
    pitch: 0
  wait:
    world: world
    x: 10
    y: 64
    z: 20
    yaw: 0
    pitch: 0

arena:
  pos1: { world: world, x: -20, y: 50, z: -20 }
  pos2: { world: world, x: 40, y: 90, z: 20 }

# Colle tes items ici. name = rename (couleurs &). Infinity 1.8 = ARROW_INFINITE.
# Infinity est force sur tous les arcs du kit, meme si /teamfight savekit a ete utilise.
kit:
  enabled: true
  use-saved: false
  items:
    - material: DIAMOND_SWORD
      amount: 1
      slot: hand
      name: "&6&lTeamFight"
      enchantments:
        - type: DAMAGE_ALL
          level: 5
        - type: DURABILITY
          level: 3
    - material: BOW
      amount: 1
      name: "&6&lTeamFight"
      enchantments:
        - type: ARROW_KNOCKBACK
          level: 2
        - type: DURABILITY
          level: 3
        - type: ARROW_INFINITE
          level: 1
    - material: DIAMOND_HELMET
      amount: 1
      slot: helmet
      name: "&6&lTeamFight"
      enchantments:
        - type: PROTECTION_ENVIRONMENTAL
          level: 4
        - type: DURABILITY
          level: 3
    - material: DIAMOND_CHESTPLATE
      amount: 1
      slot: chestplate
      name: "&6&lTeamFight"
      enchantments:
        - type: PROTECTION_ENVIRONMENTAL
          level: 4
        - type: DURABILITY
          level: 3
    - material: DIAMOND_LEGGINGS
      amount: 1
      slot: leggings
      name: "&6&lTeamFight"
      enchantments:
        - type: PROTECTION_ENVIRONMENTAL
          level: 4
        - type: DURABILITY
          level: 3
    - material: DIAMOND_BOOTS
      amount: 1
      slot: boots
      name: "&6&lTeamFight"
      enchantments:
        - type: PROTECTION_ENVIRONMENTAL
          level: 4
        - type: DURABILITY
          level: 3
    - material: GOLDEN_APPLE
      amount: 24
    - material: POTION
      amount: 32
      potion-type: INSTANT_HEAL
      potion-level: 2
      splash: true
    - material: ARROW
      amount: 1

scoreboard:
  enabled: true
  title: "&c✺ &6Draftmc.fr &c✺"

