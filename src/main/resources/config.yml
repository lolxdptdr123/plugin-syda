# Lien Minecraft <-> Discord (bot : dossier discord-bot/).
# 1. https://discord.com/developers/applications -> New Application -> Bot
# 2. Bot : Reset Token, activer MESSAGE CONTENT INTENT + SERVER MEMBERS INTENT
# 3. OAuth2 -> URL Generator : scopes bot. Permissions : Lire/Envoyer des messages,
#    Integrer des liens, Gerer les surnoms, Gerer les roles
#    (role du bot AU-DESSUS des roles de grade)
# 4. Discord : Parametres -> Avance -> Mode developpeur
# 5. Clic droit serveur -> Copier l'identifiant = GUILD_ID
#    Salon lien comptes = LINK_CHANNEL_ID
#    Salon resultats events = EVENTS_CHANNEL_ID (inutile si webhook-url est rempli)
# 6. Ici : discord-link.enabled true, api-secret = PLUGIN_SECRET du .env
# 7. discord-bot/ : copy .env.example .env  puis  npm install && node index.js
# 8. Joueur : /discord en jeu, coller DMC-XXXXXX dans le salon lien
# 9. Discord : /stats  — classements events du mois (totem, koth, teamfight, conquest, domination)
