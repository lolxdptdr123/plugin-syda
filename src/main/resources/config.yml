scoreboard:
  enabled: true
  title: "&c✺ &6Draftmc.fr &c✺"
  refresh-ticks: 20
  # Nom du grade par défaut affiché (%grade%) quand le joueur n'a pas de groupe
  # de permission particulier / n'est associé à aucune entrée ci-dessous.
  grade-default: "Joueur"
  # Nom du grade affiché dans le scoreboard (%grade%), par groupe de permission
  # (LuckPerms/PermissionsEx). La clé est le nom du groupe en minuscule.
  grades:
    owner: "&4Owner"
    admin: "&cAdmin"
    modo: "&1Modo"
    helper: "&aHelper"
    star: "Star"
    supreme: "&5Supreme"
    empereur: "&6Empereur"
    seigneur: "&eSeigneur"
    marquis: "&3Marquis"
    chevalier: "&2Chevalier"
    vip: "VIP"
    mvp: "MVP"
    default: "Joueur"
  # Couleur du grade appliquée au nom du grade ET au pseudo dans le chat public,
  # le tab-list et au-dessus de la tête, par groupe de permission (ex: &d = violet
  # clair -> "Star Pseudo" tout en violet). Le groupe "default" affiche le grade
  # Joueur dans le chat et le tab.
  grade-colors:
    owner: "&4"
    admin: "&c"
    modo: "&1"
    helper: "&a"
    default: "&7"
    star: "&d"
    supreme: "&5"
    empereur: "&6"
    seigneur: "&e"
    marquis: "&3"
    chevalier: "&2"
    vip: "&a"
    mvp: "&b"
  # Faction a cote du pseudo au-dessus de la tete (vert allie / rouge ennemi).
  nametag-faction: true
  nametag-faction-suffix: " {faction}"
  # Ne pas afficher la faction dans le tab (grade + pseudo seulement).
  tab-hide-faction: true
  # Ordre du tab (le premier est tout en haut).
  tab-order:
    - owner
    - admin
    - modo
    - helper
    - star
    - supreme
    - empereur
    - seigneur
    - marquis
    - chevalier
    - default
  tab-header-footer: true
