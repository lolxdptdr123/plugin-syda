name: Draftmc
version: ${project.version}
main: fr.draftmc.Draftmc
author: Draftmc
description: Plugin tout-en-un Factions (AntiCleanUp, Atouts, Items, Tokens...)
softdepend: [Vault, PlaceholderAPI, Votifier, NuVotifier, LuckPerms, Apollo-Bukkit, Apollo, Jobs]

commands:
  draftmc:
    description: Commande admin du plugin
    aliases: [dmc]
  admin:
    description: Menu sysadmin (staff + admin)
    aliases: [sysadmin, dadmin]
  adminlogs:
    description: Logs des commandes staff (admin/owner)
    aliases: [alogs, stafflogs]
    permission: draftmc.admin
  atouts:
    description: Menu des atouts
    aliases: [atout]
  classement:
    description: Classements joueurs
    aliases: [top, leaderboard]
  stats:
    description: Statistiques joueur (GUI)
    aliases: [stat, statistique, statistiques]
  enclume:
    description: Enclume portable
  bottlexp:
    description: Convertit l'XP en bouteille
    aliases: [xpbottle, bottle]
  enchantement:
    description: Table d'enchantement portable
    aliases: [enchant, enchanting]
  furnace:
    description: Four portable
    aliases: [four, smelt]
  randomkey:
    description: Donne une clé aléatoire
    aliases: [rkey]
    permission: draftmc.randomkey
  repair:
    description: Répare l'item en main
    aliases: [fix]
  title:
    description: Envoie un title
    permission: draftmc.admin
  actionbar:
    description: Envoie une actionbar
    aliases: [ab]
    permission: draftmc.admin
  poubelle:
    description: Poubelle
    aliases: [trash, bin]
  vision:
    description: Vision nocturne
    aliases: [nv, nightvision]
  b:
    description: Souhaite la bienvenue
    aliases: [bienvenue, welcome]
  randomtp:
    description: Téléportation aléatoire
    aliases: [rtp, wild]
  staff:
    description: Mode staff
    permission: draftmc.staff
  sc:
    description: Chat staff
    aliases: [staffchat]
    permission: draftmc.staff.chat
  cps:
    description: Voir les CPS d'un joueur
    permission: draftmc.staff
  freeze:
    description: Gèle/dégèle un joueur (immobilisation totale)
    aliases: [gel]
    permission: draftmc.staff.freeze
  mute:
    description: Mute un joueur pendant une duree
    permission: draftmc.staff.mute
  unmute:
    description: Retire le mute d'un joueur
    permission: draftmc.staff.mute
  unban:
    description: Retire le ban d'un joueur
    aliases: [pardon]
    permission: draftmc.staff.unban
  tempban:
    description: Ban un joueur pendant une duree
    aliases: [tban]
    permission: draftmc.staff.ban
  ban:
    description: Ban definitif d'un joueur
    permission: draftmc.staff.ban
  pay:
    description: Envoie de l'argent a un joueur
  ping:
    description: Affiche ton ping
  ct:
    description: Temps de combat tag restant
    aliases: [combattag]
  msg:
    description: Message privé
    aliases: [m, tell, whisper, w, t, message, pm]
  r:
    description: Répondre au dernier message privé
    aliases: [reply]
  spawn:
    description: Teleportation au spawn
  fly:
    description: Active/desactive le fly (admin)
    permission: draftmc.admin
  tags:
    description: Menu des tags (/tags create pour le staff)
    aliases: [tag]
  tokens:
    description: Tokens - utilisés uniquement dans /boutique
    aliases: [token]
  money:
    description: Argent - utilisé uniquement dans /shop
    aliases: [argent]
  f:
    description: Commandes faction Draftmc
  voteparty:
    description: VoteParty
    aliases: [vp]
  portal:
    description: Portails custom
    aliases: [portails]
    permission: draftmc.admin
  itemdraft:
    description: Donne un item Draftmc
    aliases: [ditem, giveitem]
    permission: draftmc.items.give
  boutique:
    description: Boutique Draftmc - achats avec des tokens
    aliases: [vip]
  help:
    description: Menu d'aide interactif
    aliases: [aide]
  ptr:
    description: Recompenses de temps de jeu
    aliases: [playtime]
  collection:
    description: Collections des caisses
    aliases: [collections]
  quete:
    description: Quetes joueur
    aliases: [quetes, quest, quests]
  outpost:
    description: Outposts
    aliases: [outposts]
  yt:
    description: Createurs de contenu
    aliases: [youtube, streamer]
  hub:
    description: Teleportation au hub
  baltop:
    description: Classement des plus riches
    aliases: [balancetop, moneytop]
  shop:
    description: Shop Draftmc - achats avec l'argent
    aliases: [magasin]
  rankup:
    description: Monte de grade avec ton argent
    aliases: [grade, grades]
  deathinv:
    description: Consulte le stuff fige du tueur
  feed:
    description: Nourrit le joueur (grade requis)
  pv:
    description: Coffre prive du joueur (grade requis)
  ec:
    description: Ouvre ton enderchest (grade requis)
  refill:
    description: Remplit les slots vides avec des potions (grade requis)
  craft:
    description: Table de craft portable (grade requis)
  near:
    description: Joueurs proches (grade requis)
  grades:
    description: Liste les commandes debloquees par grade
    aliases: [gradecmds]
  kit:
    description: Menu des kits debloques
    aliases: [kits]
  hat:
    description: Place l'item en main sur la tete (grade Empereur)
  back:
    description: Retour a la derniere position (grade Empereur)
  compact:
    description: Compacte minerais/lingots (grade Marquis)
  invsee:
    description: Voir l'inventaire d'un joueur (grade Supreme)
  sellall:
    description: Vend tout l'inventaire (grade Supreme)
  sell:
    description: /sell all
  home:
    description: Teleporte a un home
  sethome:
    description: Definit un home
  delhome:
    description: Supprime un home
  homes:
    description: Liste tes homes
  warp:
    description: Teleporte a un warp
  warps:
    description: Liste les warps
  setwarp:
    description: Cree un warp (staff)
    permission: draftmc.staff
  delwarp:
    description: Supprime un warp (staff)
    permission: draftmc.staff
  tpa:
    description: Demande a te teleporter a un joueur
  tpahere:
    description: Demande a un joueur de se teleporter a toi
  tpyes:
    description: Accepte une demande de teleportation
    aliases: [tpaccept, tpac]
  tpdeny:
    description: Refuse une demande de teleportation
    aliases: [tpno]
  hdv:
    description: Hotel des ventes
    aliases: [ah, auction]
  discord:
    description: Lie ton compte Minecraft a Discord
    aliases: [linkdiscord]
  report:
    description: Signale un joueur au staff
  reports:
    description: Liste des reports (staff)
    permission: draftmc.staff
  banitem:
    description: Interdit/autorise l'item en main (admin)
    aliases: [banitems]
    permission: draftmc.admin
  conquest:
    description: Event Conquest
    aliases: [cq]
    permission: conquest.admin
  domination:
    description: Event Domination
    aliases: [dom]
    permission: domination.admin
  br:
    description: Event Battleroyal
    aliases: [battleroyal, battleroyale, battle]
    permission: battleroyal.admin
  masterkill:
    description: Event MasterKill
    aliases: [mk]
    permission: masterkill.admin
  totem:
    description: Event Totem
    aliases: [tot]
    permission: totem.admin
  totemgeant:
    description: Event Totem Geant
    aliases: [totemg, gianttotem]
    permission: totem.admin
  totemstats:
    description: Stats du dernier Totem
    aliases: [totemstat, tstats]
  koth:
    description: Event KOTH Geant
    aliases: [kothgeant, kothg]
    permission: koth.admin
  teamfight:
    description: Event TeamFight 8v8
    aliases: [tf, 8v8]
  largage:
    description: Event Largage (coffres aux positions configurées)
    aliases: [airdrop, drop]
    permission: largage.admin
  deathban:
    description: Ban d'un monde pour une duree
    aliases: [db]
    permission: deathban.admin
  event:
    description: Planning des events Draftmc
    aliases: [events]
  tournament:
    description: Tournoi PvP
    aliases: [tournoi, tourney]
  status:
    description: Status du tournoi en cours
  clearlag:
    description: Nettoyage des entites (auto toutes les 5 min)
    aliases: [clag, lagg]
    permission: draftmc.admin

permissions:
  draftmc.admin:
    default: op
    children:
      conquest.admin: true
      domination.admin: true
      battleroyal.admin: true
      masterkill.admin: true
      totem.admin: true
      koth.admin: true
      teamfight.admin: true
      largage.admin: true
      draftmc.tournament.admin: true
      deathban.admin: true
      deathban.bypass.ban: true
      deathban.bypass.teleport: true
      deathban.bypass.commands: true
      draftmc.event: true
      draftmc.faction.top: true
      draftmc.staff: true
      draftmc.staff.chat: true
      draftmc.staff.mute: true
      draftmc.staff.freeze: true
      draftmc.staff.ban: true
      draftmc.staff.unban: true
      draftmc.adminlogs: true
      draftmc.gradecommands.bypass: true
  draftmc.adminlogs:
    default: false
    description: Consulter les logs de commandes du staff
  draftmc.staff:
    default: op
  draftmc.staff.chat:
    default: op
    description: /sc chat staff
  draftmc.staff.freeze:
    default: op
  draftmc.staff.mute:
    default: op
    description: /mute et /unmute
  draftmc.staff.unban:
    default: op
    description: /unban
  draftmc.staff.ban:
    default: op
    description: /tempban
  draftmc.mute.bypass:
    default: op
    description: Ne peut pas etre mute
  draftmc.ban.bypass:
    default: op
    description: Ne peut pas etre banni via /tempban
  draftmc.bypass.commands:
    default: op
  draftmc.banitem.bypass:
    default: op
    description: Peut utiliser les items interdits (le craft reste bloqué pour tous)
  draftmc.doublexp:
    default: false
  draftmc.repair:
    default: false
  draftmc.repair.bypass:
    default: op
  draftmc.fly:
    default: false
  draftmc.faction.bypass:
    default: op
  draftmc.gradecommands.bypass:
    default: false
    description: Ignore les restrictions de grade pour /feed, /pv, etc.
  draftmc.tokens.give:
    default: op
  draftmc.money.give:
    default: op
  draftmc.items.give:
    default: op
  conquest.admin:
    default: op
  conquest.start:
    default: op
  conquest.stop:
    default: op
  conquest.reload:
    default: op
  domination.admin:
    default: op
  domination.start:
    default: op
  domination.stop:
    default: op
  domination.reload:
    default: op
  battleroyal.admin:
    default: op
  masterkill.admin:
    default: op
  masterkill.start:
    default: op
  masterkill.stop:
    default: op
  masterkill.reload:
    default: op
  totem.admin:
    default: op
  koth.admin:
    default: op
  teamfight.admin:
    default: op
  draftmc.tournament.admin:
    default: op
    description: Commandes admin du tournoi
  deathban.admin:
    default: op
  deathban.bypass.ban:
    default: op
  deathban.bypass.teleport:
    default: op
  deathban.bypass.commands:
    default: op
  draftmc.welcome:
    default: true
  draftmc.rtp:
    default: true
  draftmc.randomkey:
    default: op
  draftmc.event:
    default: op
    description: /event start, stop, list, info (le planning /event est public)
  draftmc.faction.top:
    default: op
    description: Gerer le F Top (/f top add, remove, reset)
  draftmc.combattag.bypass:
    default: false
    description: Ignore le blocage des commandes du combat tag (le tag s'applique quand meme)
  draftmc.enderpearl.bypass:
    default: op
    description: Ignore le cooldown des enderpearls
  draftmc.tpa:
    default: true
    description: Commandes /tpa /tpyes /tpdeny /tpahere
