# ============================================================
# KITS SYDARIA - Guide
# ============================================================
#
# 1) MODIFIER / CREER UN KIT ici (plugins/Sydaria/kits.yml)
# 2) LE VENDRE dans config.yml -> boutique -> categories -> kits
# 3) LE JOUEUR l'achete en /boutique puis le recupere en /kit
#
# REGLES DES ITEMS :
#   amount: 16        = 16 items (1 par slot inventaire par defaut)
#   stack: true       = empiler en un seul slot (ex: 64 torches)
#   (sans stack)      = chaque item dans un slot separe (ideal potions PvP)
#
# TYPES D'ITEMS :
#   - item Sydaria    : item: DASH_FEATHER
#   - item vanilla    : material: GOLDEN_APPLE
#   - potion          : potion-type + level + splash
#
# ENCHANTEMENTS (sur armes/armures) :
#   enchants:
#     PROTECTION: 4        # Protection IV (alias)
#     UNBREAKING: 3         # Solidite III (alias)
#   Noms 1.8 aussi acceptes : PROTECTION_ENVIRONMENTAL, DURABILITY, SHARPNESS...
#
# POTIONS (level 2 = niveau II) :
#   potion-type: INSTANT_HEAL   (soin)
#   potion-type: SPEED
#   potion-type: STRENGTH       (force)
#   potion-type: FIRE_RESISTANCE
#   splash: true                (lançable)
#   splash: false               (a boire)
#
# Apres modification : /sydaria reload
# ============================================================

